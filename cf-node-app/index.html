<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>SAP BTP Pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(180deg, #f5f5f7 0%, #e8e8ed 100%);
      min-height: 100vh;
      color: #1d1d1f;
    }
    body {
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      padding-top: max(env(safe-area-inset-top), 12px);
      padding-bottom: max(env(safe-area-inset-bottom), 24px);
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      margin-bottom: 24px;
    }
    .nav-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 16px;
      padding: 28px 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .card:last-of-type { margin-bottom: 0; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #34c759;
      flex-shrink: 0;
    }
    .status-label {
      font-size: 15px;
      color: #86868b;
      font-weight: 500;
    }
    .status-value {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-top: 4px;
    }
    .hero {
      text-align: center;
      padding: 32px 0 24px;
    }
    .hero h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero p {
      font-size: 15px;
      color: #86868b;
      font-weight: 500;
    }
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 13px;
      color: #86868b;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-title">SAP BTP</span>
  </nav>
  <div class="hero">
    <h1>SAP BTP Pipeline OK</h1>
    <p>App rodando no Cloud Foundry</p>
  </div>
  <div class="card">
    <div class="status-row">
      <span class="dot"></span>
      <div>
        <div class="status-label">Status</div>
        <div class="status-value">Online</div>
      </div>
    </div>
    <div class="status-row">
      <span class="dot"></span>
      <div>
        <div class="status-label">Ambiente</div>
        <div class="status-value">{{ENV_DISPLAY}}</div>
      </div>
    </div>
    <div class="status-row">
      <span class="dot"></span>
      <div>
        <div class="status-label">Platform</div>
        <div class="status-value">Cloud Foundry</div>
      </div>
    </div>
  </div>
  <p class="footer">BTP · Trial</p>
</body>
</html>
